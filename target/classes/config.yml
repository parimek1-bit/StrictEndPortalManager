#Префикс для каждого сообщения которое будет отправлено игроку
prefix: "&8[&6StrictMC&8] "
#Блокировка эндер мира
end-block:
  #Включить блокировку эндер мира или нет, по умолчанию выключено
  enable: false
  #Обход блокировки эндер мира
  #Можно использовать для донатеров или для администрации
  bypass:
    permission: "strict.endbypass"
  #Что делать если игрок зашёл на сервер будучи в эндер мире
  player-join-on-world-the-end:
    #Написать команду от имени игрока или от консоли
    #Если от имени игрока то можно просто написать spawn,
    #без использования слэша(Кривой палки: /)
    #Если true, то команда отправляется от имени консоли,
    #если false, то команда отправляется от имени консоли
    command-by-console: true
    #Команда, которая выполняется, если игрок заходя на сервер находится в эндер мире
    command: "spawn {player}"
  #Сообщение о блокировке эндер мира
  message:
    #Включить ли сообщение о блокировке эндер мира
    enable: true
    #Сообщение, которое будет отправлено если игрок попытается войти в эндер мир
    message: "&cЭндер мир заблокирован!"

#Заменяет рамку эндер портала, на блок портала в эндер мир
#Взято и улучшено(немного) с оригинального AntiEndPortalFrame
#GitHub: https://github.com/parimek0/AntiEnderPortalFrame
end-portal-frame-replace:
  #Включить замену рамки или нет
  enable: true
  #Право, которое разрешает игрокам ставить рамку, так чтобы она превращалась в портал
  #если прав нет, то игрок не сможет поставить рамку
  permissions:
    #По умолчанию выключено
    enable: false
    #Само право на использование рамки
    permission: "strict.portal.place"
    #Сообщение о том что не хватает прав :-)
    message:
      enable: true
      message: "&cУ вас нет прав чтобы ставить блок портала в эндер мир!"
  #Сообщение о том что блок портала был установлен
  message:
    #Включить или выключить сообщение
    enable: true
    #Само сообщение о том что блок портала был установлен, можно использовать переменные
    #координат, то есть {x} {y} {z}
    message: "&aПортал был успешно поставлен, координаты: &3{x}&aX &3{y}&aY &3{z}&aZ"
